# Per-portal apply recipes — consumed by `scripts/gmail-apply.mjs`.
#
# Architecture: a Playwright script (scripts/gmail-apply.mjs) connects to the
# user's Chrome over CDP (port 9222 — launch via launch-chrome.bat), matches
# the URL to a portal here, executes the steps using Playwright's locator
# API, then re-reads the form to verify. No LLM tokens during the run.
#
# Field reference:
#   match            — substring(s) checked against active URL. First match wins.
#   submit_selector  — clicked LAST. Script stops before this and exits.
#                      User clicks Submit manually (or pass --submit to auto-click).
#   data             — candidate data inlined. {{key}} in step.value resolves from here.
#   steps            — ordered actions. Action types (Playwright primitives):
#                        click          { selector }
#                        fill           { selector, value }       value supports {{key}}
#                        select         { selector, value }       <select> element; matches by value
#                        check          { container, label, label_aliases? }
#                                       finds checkbox by visible label inside container,
#                                       label_aliases for locale-independent matching
#                        wait_selector  { selector }              5s timeout
#                        wait_ms        { ms }                    sleep
#
#                      Any step may set `optional: true`. When optional, the script
#                      probes for the step's selector/container; if absent on this
#                      job's form, the step is silently skipped (not a failure) and
#                      the verifier marks it skipped. Use for fields that only some
#                      jobs on the same portal require (e.g. nofluffjobs location
#                      dropdown, present on multi-location listings only).
#
# Adding a portal: inspect form in browser, capture stable selectors, append entry.
# Script handles framework quirks generically via Playwright (Angular, React, plain HTML).

portals:

  # =========================================================================
  # nofluffjobs.com — Angular SSR. Modal-based apply flow. Form labels
  # localized to browser language → use label_aliases for the language check.
  # =========================================================================
  - name: nofluffjobs
    match:
      - "nofluffjobs.com/"
    submit_selector: "#sendApplicationButton button"
    # success_selector — STRICT confirmation. Script waits up to
    # success_timeout_ms for ANY listed selector to become visible after the
    # submit click. None match → submitted_unconfirmed:true → real failure.
    # Worker MUST escalate via MCP.
    #
    # Verified post-submit DOM (user-confirmed):
    #   <aside class="...tw-bg-teal-veryLight...">
    #     <inline-icon commonicon="success_circle_raw">...</inline-icon>
    #     <p>Aplikacja została wysłana. Dziękujemy, że aplikujesz z No Fluff Jobs.</p>
    #     <span data-cy="post apply survey button">Oceń proces aplikowania</span>
    #   </aside>
    success_selector:
      - "[data-cy='post apply survey button']"
      - "inline-icon[commonicon=success_circle_raw]"
      - "aside:has-text('Aplikacja została wysłana')"
      - "aside:has-text('Application has been sent')"
    success_timeout_ms: 10000
    data:
      phone: "+436703535652"
    steps:
      - { action: click, selector: "#applyButton" }
      - { action: wait_selector, selector: "#apply-modal" }
      - { action: wait_ms, ms: 800 }
      - action: fill
        selector: "#apply-modal input[formcontrolname=phoneNumber]"
        value: "{{phone}}"
      - action: check
        container: "#apply-modal nfj-apply-known-languages"
        label: "English"
        label_aliases: ["English", "Englisch", "Anglais", "Inglés", "Inglese", "Angielski"]
      # B2B-agency variants (e.g. Square One Resources) inject extra required
      # fields — handled as optional so they no-op on jobs that don't have them.
      # Location is a custom Angular nfj-multiselect-dropdown (no native select),
      # so it needs the dedicated select_multiselect action with real CDP click.
      - action: select_multiselect
        selector: "#apply-modal nfj-form-field:has(label:has-text('lokalizacj'))"
        # Remote-only — Salzburg-based candidate. NEVER fall back to a city
        # (e.g. Warsaw) on patterns miss; require_match=true forces fail-stop.
        # Polish ("Praca zdalna" / "zdalna") + EN/DE Remote variants covered.
        match: ["^Praca zdalna$", "^Zdalnie$", "^Remote$", "Praca zdalna", "Zdalnie", "(?:^|\\W)Remote(?:$|\\W)"]
        require_match: true
        optional: true
        timeout_ms: 2000
      # Some variants require an "I want to receive new offers" subscription
      # consent checkbox (NFJ-CHECKBOX). Optional — skipped when not present.
      - action: check
        container: "#apply-modal"
        label: "Chcę otrzymywać nowe oferty"
        label_aliases:
          - "Chcę otrzymywać nowe oferty"
          - "I want to receive new offers"
        optional: true
      # STOP. Script exits before submit_selector. User/worker clicks Submit.

  # =========================================================================
  # theprotocol.it — DUAL-MODE. Sidebar Aplikuj button (data-test='anchor-apply',
  # carries data-isexternal="true|false") routes to one of two flows:
  #   external (data-isexternal=true): opens new tab to recruiter form
  #     (erecruiter.pl etc) → script's redirect/new-page detection fires →
  #     worker handles via External ATS handover (mcp_fill_form).
  #   inline   (data-isexternal=false): reveals sidebar form on same page
  #     with [data-test='button-sendApplication'] submit + input-phoneNumber.
  # We click the unified anchor-apply (same selector for both modes) and rely
  # on optional follow-up steps that no-op when the inline form does not appear
  # (i.e. external path was taken). This makes the recipe self-healing across
  # both variants without per-listing branching.
  # Verified 2026-05-05: legacy data-test='button-expandApplyForm' no longer in DOM.
  # =========================================================================
  - name: theprotocol
    match:
      - "theprotocol.it/szczegoly/praca/"
    submit_selector: "[data-test='button-sendApplication']"
    success_selector:
      - "[data-test='thankYouView']"
      - "[data-test='thankYouApply-title']"
    success_timeout_ms: 10000
    data:
      phone: "+436703535652"
    steps:
      - { action: click, selector: "[data-test='section-sidebar-apply'] [data-test='anchor-apply']" }
      # Inline-mode follow-ups. Skipped silently if external mode took us to a
      # new tab (sendApplication never appears on this page).
      - { action: wait_selector, selector: "[data-test='button-sendApplication']", timeout_ms: 4000, optional: true }
      - action: fill
        selector: "input[data-test='input-phoneNumber']"
        value: "{{phone}}"
        optional: true
      # STOP. Inline: user/script clicks Submit. External: worker takes over.

  # =========================================================================
  # xing.com — React SPA. Multi-step wizard (4 pages, no modal).
  # "Easy apply" navigates to /jobs/custom-apply/{slug}.
  # Step 1: name/email pre-filled from XING profile, needs phone + country.
  # Step 2: employer custom questions (language dropdowns — job-specific).
  # Step 3: CV upload — XING caches the uploaded CV after first use.
  # Step 4: review page — "Send application" is the real submit_selector.
  # =========================================================================
  - name: xing
    match:
      - "xing.com/jobs/"
    submit_selector: "button:has-text('Send application')"
    success_selector:
      - "h1:has-text('Application submitted')"
      - "h2:has-text('Application submitted')"
    success_timeout_ms: 15000
    data:
      # phoneNumber input takes BARE digits (no +43, no leading 0). The
      # countryCode select is filled separately with "43". Validators reject
      # the field if a "+43" or "0043" prefix is in the digits — the form
      # double-prefixes and shows "Please check your phone number again".
      phone: "6703535652"
      german_level: "Verhandlungssicher"
      english_level: "Muttersprache oder zweisprachig"
    steps:
      # Trigger apply — navigates to /jobs/custom-apply/... or /jobs/quick-apply/...
      # Quick-apply: profile complete, skips multi-step form, goes straight to review.
      - { action: click, selector: "[data-testid='apply-button']" }
      - { action: wait_selector, selector: "select[name='phone.value.countryCode']", optional: true }
      - { action: wait_ms, ms: 800 }
      # Step 1 — personal info (name/email pre-filled from XING profile)
      - { action: select, selector: "select[name='phone.value.countryCode']", value: "43", optional: true }
      - { action: fill, selector: "input[name='phone.value.phoneNumber']", value: "{{phone}}", optional: true }
      - { action: click, selector: "button:has-text('Continue')", optional: true }
      - { action: wait_selector, selector: "select[name='customQuestions.0.value']", optional: true }
      - { action: wait_ms, ms: 600 }
      # Step 2 — employer custom questions (language proficiency for this job)
      # Values are job-specific — defaults cover DE/EN proficiency questions.
      - { action: select, selector: "select[name='customQuestions.0.value']", value: "{{german_level}}", optional: true }
      - { action: select, selector: "select[name='customQuestions.1.value']", value: "{{english_level}}", optional: true }
      - { action: click, selector: "button:has-text('Continue')", optional: true }
      - { action: wait_selector, selector: "[data-test='upload-button']", optional: true }
      - { action: wait_ms, ms: 600 }
      # Step 3 — CV upload. XING caches CV after first upload — field pre-filled on repeat use.
      # script_extension_needed: upload action (input[type=file], accept=pdf|doc|...)
      - { action: click, selector: "button:has-text('Continue')", optional: true }
      - { action: wait_selector, selector: "button:has-text('Send application')", optional: true }
      - { action: wait_ms, ms: 600 }
      # Step 4 — review page. STOP. Script exits before submit_selector.
      # User reviews + clicks "Send application" (or pass --submit to auto-click).
