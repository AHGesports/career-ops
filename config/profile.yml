# Used by mcp/gmail-html/scripts/classify.mjs to triage Gmail-scanned URLs.
# Match logic: case-insensitive regex on URL slug + email subject.
# - If a URL hits any match_keywords AND no match_excludes → tag = auto-match
#   (lands in pipeline.md with score 5.0 + applications.md row via TSV merge)
# - Otherwise → tag = deferred (lands in data/pipeline-deferred.md, awaits /deeper-eval)
gmail_classifier:
  match_keywords:
    # NOTE: patterns run AFTER URL slug normalization (-_/?=& → space, lowercased).
    # So use \b word boundaries; literal dots in tech names won't survive in slugs.
    # Hard primary stack — drawn from cv.md
    - "\\bnet\\b"          # matches ".net", "-net-", "net developer"
    - "\\bdotnet\\b"
    - "\\baspnet\\b"
    - "\\basp net\\b"
    - "\\bc#"              # c# usually preserved as literal token in subjects
    - "\\bcsharp\\b"
    - "\\bc sharp\\b"
    - "\\bblazor\\b"
    - "\\befcore\\b"
    - "\\bef core\\b"
    - "\\bentity framework\\b"
    - "\\bangular\\b"
    - "\\brxjs\\b"
    # Adjacent — TypeScript/Node ecosystem
    - "\\btypescript\\b"
    - "\\bnodejs\\b"
    - "\\bnode js\\b"
    - "\\bexpress\\b"
    - "\\bnestjs\\b"
    - "\\bfullstack\\b"
    - "\\bfull stack\\b"
    # Adjacent — Python/FastAPI (Elyt + Atra)
    - "\\bfastapi\\b"
    - "\\bpython\\b"
    # Adjacent — AI/automation (Elyt)
    - "\\bllm\\b"
    - "\\bgenai\\b"
    - "\\bagentic\\b"
    - "\\blangchain\\b"
    - "\\bopenai\\b"
    - "\\banthropic\\b"
    - "\\bautomation engineer\\b"
    # Adjacent — DevOps/infra (Axess + Atra)
    - "\\bazure\\b"
    - "\\bazure devops\\b"
  match_excludes:
    # Hard mismatches — even if title accidentally hits a match keyword
    - "\\bphp\\b"
    - "\\blaravel\\b"
